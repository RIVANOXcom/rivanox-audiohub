# AudioHub ALPHA A2DP receiver: a phone sends audio TO this Pi.
# WirePlumber defaults bluez5.media-source-role to "playback", which can
# auto-link a phone directly to a default sink, bypassing AudioHub's
# independent music/tablet per-source EQ route. Request input role for
# bluez_input nodes so the supervisor can capture them explicitly.
# Requires real Pi4/BlueZ/WirePlumber verification; NOT owner authentication.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
  bluez5.codecs = [ sbc ]
}
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_input.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.media-source-role = input
      }
    }
  }
]

name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  documentation-and-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Exact immutable PR head, never the synthetic pull-request merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check mandatory project policies
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          test -s SECURITY.md
          test -s docs/STATUS.md
          test -s docs/RELEASE-POLICY.md
          test -s .github/FUNDING.yml
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q "No verified ready-to-flash" docs/STATUS.md
          if grep -RInF 'AudioHub-Setup-2026' src image; then
            echo "Unsafe shared provisioning secret detected" >&2
            exit 1
          fi
      - name: Review-only Model C licensing safety guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/license_transition_audit.py

      - name: Detect unreviewed source runtime dependencies and third-party assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source_dependency_audit.py

      - name: Require per-file source ownership and third-party review ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source_rights_ledger.py

      - name: Check any checked-in Python or JS sources
        shell: bash
        run: |
          set -euo pipefail
          if [ -d src ]; then python3 -m compileall -q src; fi
          if [ -d tests ]; then python3 -m unittest discover -s tests -v; fi
          if [ -f web/app.js ]; then node --check web/app.js; fi
          bash -n build-image.sh image/stage-audiohub/prerun.sh image/stage-audiohub/01-install/00-run.sh
      - name: Package offline Windows bridge alpha (NOT a release)
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 scripts/package_windows_bridge.py --source-sha "$SOURCE_COMMIT" --directory dist/windows
          cd dist/windows
          sha256sum -c SHA256SUMS-WINDOWS.txt
          python3 - <<'PY'
          import glob
          import zipfile
          archives = glob.glob("AudioHub-Windows-TLS-Bridge-ALPHA-*.zip")
          assert len(archives) == 1
          with zipfile.ZipFile(archives[0]) as archive:
              assert archive.testzip() is None
              assert len(archive.namelist()) == 19
          print("Windows portable bridge bundle integrity PASS; NOT released")
          PY
      - name: Upload temporary Windows offline operator alpha
        id: windows_alpha
        uses: actions/upload-artifact@v4
        with:
          name: AUDIOHUB-WINDOWS-TLS-ALPHA-UNVERIFIED
          path: |
            dist/windows/AudioHub-Windows-TLS-Bridge-ALPHA-*.zip
            dist/windows/SHA256SUMS-WINDOWS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Show Windows lab package in job summary
        shell: bash
        env:
          BUNDLE_ARTIFACT_URL: ${{ steps.windows_alpha.outputs.artifact-url }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_ARTIFACT_URL"
          {
            echo "## Windows TLS audio bridge: UNVERIFIED isolated lab ALPHA"
            echo
            echo "**[Download temporary operator ZIP]($BUNDLE_ARTIFACT_URL)**"
            echo
            echo "Archive contains nested platform ZIP and SHA256SUMS-WINDOWS.txt."
            echo "Not a Windows driver or production release. Requires Python 3.11+,"
            echo "Scream driver for program audio (NOT for speaker soundcheck), keys and"
            echo "an explicitly authorized isolated Pi4 lab. No auto installation."
            echo
            echo "Source SHA: $SOURCE_COMMIT"
            echo "Local bundle checksum:"
            echo '~~~'
            cat dist/windows/SHA256SUMS-WINDOWS.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
  windows-operator-smoke:
    # Cross-OS byte-for-byte ZIP proof, real Windows Python/Tk/import/smoke.
    needs: documentation-and-safety
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact-head Linux portable ZIP checksum
        uses: actions/download-artifact@v4
        with:
          name: AUDIOHUB-WINDOWS-TLS-ALPHA-UNVERIFIED
          path: dist/linux-baseline
      - name: Native Windows GUI/portable offline smoke
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'src'
          python -m unittest discover -s tests -p "test_windows*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows offline tests failed' }
          python -m unittest discover -s tests -p "test_offline_wav_prep.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows WAV preparation tests failed' }
          python -c "import tkinter; print('Windows Tk runtime available: ', tkinter.TkVersion)"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Tk unavailable' }
          python scripts/package_windows_bridge.py --source-sha $env:SOURCE_COMMIT --directory dist/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed' }
          $package = Get-ChildItem dist/windows -Filter "AudioHub-Windows-TLS-Bridge-ALPHA-*.zip" | Select-Object -First 1
          if (-not $package) { throw 'No Windows alpha ZIP' }
          $expected = ((Get-Content dist/windows/SHA256SUMS-WINDOWS.txt -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Windows package SHA256 mismatch' }
          $linuxExpected = ((Get-Content dist/linux-baseline/SHA256SUMS-WINDOWS.txt -Raw).Trim() -split '\s+')[0]
          if ($linuxExpected -ne $actual) { throw 'Windows vs Linux ZIP bytes differ for exact source SHA' }
          Write-Host ("Cross-OS identical source ZIP SHA256: " + $actual)
          Expand-Archive -LiteralPath $package.FullName -DestinationPath dist/windows/unpacked
          $folder = Join-Path (Resolve-Path dist/windows/unpacked) ("AudioHub-Windows-TLS-Bridge-ALPHA-" + $env:SOURCE_COMMIT.Substring(0, 12))
          Push-Location $folder
          try {
            python START-WINDOWS-BRIDGE.py --self-check
            if ($LASTEXITCODE -ne 0) { throw 'Portable starter failed' }
            python START-WINDOWS-BRIDGE.py --gui --help
            if ($LASTEXITCODE -ne 0) { throw 'Portable GUI CLI failed' }
            python START-OFFLINE-WAV-PREP.py --gui --help
            if ($LASTEXITCODE -ne 0) { throw 'Extracted file picker option unavailable' }
            & cmd.exe /d /c '.\OPEN-AUDIOHUB-MUSIC-PREP.cmd --check'
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows one-click launcher offline check failed' }
            Write-Host 'One-click Windows local music launcher: no-write setup check PASS'
            $owned = Join-Path $env:RUNNER_TEMP 'audiohub-owned-synthetic.flac'
            $newWav = Join-Path $env:RUNNER_TEMP 'audiohub-unused-synthetic.wav'
            [System.IO.File]::WriteAllBytes($owned, [byte[]](0x12,0x34,0x56,0x78))
            python START-OFFLINE-WAV-PREP.py --source $owned --output $newWav
            if ($LASTEXITCODE -ne 0) { throw 'Extracted Windows WAV preview failed' }
            if (Test-Path -LiteralPath $newWav) { throw 'Read-only WAV preview created output' }
            Write-Host 'Extracted Windows WAV no-write preview and GUI option PASS'
            # Exercise the NEW WAV verifier from the actual extracted ZIP,
            # with synthetic audio and no external FFmpeg or device.
            $verifyWav = Join-Path $env:RUNNER_TEMP 'audiohub-verify-only.wav'
            python -c "import sys,wave; f=wave.open(sys.argv[1],'wb'); f.setnchannels(2); f.setsampwidth(2); f.setframerate(48000); f.writeframes(bytes(4*480)); f.close()" $verifyWav
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic WAV setup failed' }
            $wavHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $verifyWav).Hash.ToLowerInvariant()
            $verified = & python START-OFFLINE-WAV-PREP.py --verify-wav $verifyWav
            if ($LASTEXITCODE -ne 0) { throw 'Extracted portable WAV verification failed' }
            if (-not (($verified -join "\n").Contains($wavHash))) { throw 'Portable WAV reported wrong SHA256' }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $verifyWav).Hash.ToLowerInvariant() -ne $wavHash) {
              throw 'Read-only portable WAV verifier changed its input'
            }
            Write-Host 'Extracted portable WAV structure and SHA256 verification PASS (synthetic)'
            # Exercise the NEW audible audition CLI using a REAL extracted
            # portable Python file, with in-memory winsound stub. NO Windows
            # speaker, Pi, user music, mixer setting or hardware audio touched.
            $auditionProbe = @'
          import io
          import sys
          import types
          import wave
          
          fake = types.ModuleType("winsound")
          fake.SND_MEMORY = 4
          fake.SND_NODEFAULT = 2
          def check_memory_sound(data, flags):
              if not isinstance(data, bytes) or flags != 6:
                  raise RuntimeError("PC WAV audition must use synchronous memory audio")
              with wave.open(io.BytesIO(data), "rb") as sample:
                  if (sample.getnchannels(), sample.getsampwidth(), sample.getframerate()) != (2, 2, 48000):
                      raise RuntimeError("Audition supplied unexpected WAV format")
          fake.PlaySound = check_memory_sound
          sys.modules["winsound"] = fake
          from audiohub import offline_wav_prep as prep
          # Audible S3 test without ANY music/FFmpeg: verify generated 1s
          # PC tone with a substituted Windows audio module, no real sound.
          generated = prep.generate_pc_test_tone()
          if len(generated) != 192044:
              raise RuntimeError("Synthetic PC tone must be bounded to 1s")
          with wave.open(io.BytesIO(generated), "rb") as sample:
              if sample.getnframes() != 48000:
                  raise RuntimeError("Expected generated 48k-frame PC tone")
          played = prep.play_pc_test_tone(sound_module=fake)
          if played != {"seconds": 1.0, "synthetic": True}:
              raise RuntimeError("PC tone did not submit expected sample")
          if prep.main(["--test-pc-tone"]) != 0:
              raise RuntimeError("Synthetic PC tone CLI did not finish")
          # The one-click replay of an exported file must refuse if the
          # previously confirmed SHA256 does not match BEFORE any sound.
          current_sha = prep.verify_local_wav(sys.argv[1])["sha256"]
          matched = prep.play_local_wav_audition(
              sys.argv[1], expected_sha256=current_sha, sound_module=fake)
          if matched["source_sha256"] != current_sha:
              raise RuntimeError("Last export hash not returned intact")
          try:
              prep.play_local_wav_audition(
                  sys.argv[1], expected_sha256="0" * 64, sound_module=fake)
          except ValueError:
              pass
          else:
              raise RuntimeError("Changed last export unexpectedly played")
          raise SystemExit(prep.main(["--audition-wav", sys.argv[1]]))
          '@
            $auditionReport = & python -c $auditionProbe $verifyWav
            if ($LASTEXITCODE -ne 0 -or -not (($auditionReport -join "`n").Contains('LOCAL PC WAV AUDITION FINISHED')) -or -not (($auditionReport -join "`n").Contains('SYNTHETIC PC TONE FINISHED'))) {
              throw 'Extracted PC WAV audition did not exercise Windows memory audio path'
            }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $verifyWav).Hash.ToLowerInvariant() -ne $wavHash) {
              throw 'Read-only audible WAV preview altered original'
            }
            Write-Host 'Extracted Windows WAV audition and generated 1-second PC tone PASS (stubbed, no speaker or private music)'

            $library = Join-Path $env:RUNNER_TEMP 'audiohub-private-synthetic-library'
            New-Item -ItemType Directory -Path $library -ErrorAction Stop | Out-Null
            $libraryWav = Join-Path $library 'owned-synthetic.wav'
            Copy-Item -LiteralPath $verifyWav -Destination $libraryWav -ErrorAction Stop
            $originalHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $libraryWav).Hash.ToLowerInvariant()
            $folderReport = & python START-OFFLINE-WAV-PREP.py --verify-folder $library
            if ($LASTEXITCODE -ne 0) { throw 'Portable private WAV folder check failed' }
            if (-not (($folderReport -join "`n").Contains('LOCAL WAV FOLDER VERIFIED: 1'))) {
              throw 'Missing portable folder verification result'
            }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $libraryWav).Hash.ToLowerInvariant() -ne $originalHash) {
              throw 'Private folder check modified synthetic WAV'
            }
            Write-Host 'Extracted portable 1-folder WAV verification PASS (synthetic, no writes)'
            # Read-only two-folder comparison from actual extracted portable.
            $copyDir = Join-Path $env:RUNNER_TEMP 'audiohub-private-synthetic-copy'
            New-Item -ItemType Directory -Path $copyDir -ErrorAction Stop | Out-Null
            $copiedWav = Join-Path $copyDir 'different-private-name.wav'
            Copy-Item -LiteralPath $libraryWav -Destination $copiedWav -ErrorAction Stop
            $compareOutput = & python START-OFFLINE-WAV-PREP.py --compare-folders $library $copyDir
            if ($LASTEXITCODE -ne 0 -or -not (($compareOutput -join "`n").Contains('LOCAL WAV COPY MATCH'))) {
              throw 'Extracted Windows WAV copy comparison match failed'
            }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $copiedWav).Hash.ToLowerInvariant() -ne $originalHash) {
              throw 'Read-only copy check changed original copy'
            }
            # Two original files with reversed name-based order in copy must
            # still match by complete file content. No decoder/network/Pi.
            $secondSource = Join-Path $library 'z-source-other.wav'
            $secondCopy = Join-Path $copyDir 'a-copy-other.wav'
            python -c "import sys,wave;f=wave.open(sys.argv[1],'wb');f.setnchannels(2);f.setsampwidth(2);f.setframerate(48000);f.writeframes(bytes([2,4,6,8])*480);f.close()" $secondSource
            if ($LASTEXITCODE -ne 0) { throw 'Second synthetic WAV creation failed' }
            Copy-Item -LiteralPath $secondSource -Destination $secondCopy -ErrorAction Stop
            $secondOriginalHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $secondSource).Hash.ToLowerInvariant()
            $renamedReport = & python START-OFFLINE-WAV-PREP.py --compare-folders $library $copyDir
            if ($LASTEXITCODE -ne 0 -or -not (($renamedReport -join "`n").Contains('LOCAL WAV COPY MATCH: 2'))) {
              throw 'Renamed and reversed WAV order falsely rejected'
            }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $secondSource).Hash.ToLowerInvariant() -ne $secondOriginalHash) {
              throw 'Order-independent compare modified second source'
            }
            Write-Host 'Renamed/reordered two-file WAV copy MATCH (synthetic, no writes)'

            python -c "import sys,wave;f=wave.open(sys.argv[1],'wb');f.setnchannels(2);f.setsampwidth(2);f.setframerate(48000);f.writeframes(bytes([1,2,3,4])*480);f.close()" $copiedWav
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic changed WAV generation failed' }
            $differentOutput = & python START-OFFLINE-WAV-PREP.py --compare-folders $library $copyDir
            if ($LASTEXITCODE -ne 1 -or -not (($differentOutput -join "`n").Contains('LOCAL WAV COPY DIFFERS'))) {
              throw 'Extracted Windows WAV copy mismatch detection failed'
            }
            # Return code 1 means the expected valid mismatch, not a failed
            # test. Reset the shell's last native command exit status.
            $global:LASTEXITCODE = 0
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $libraryWav).Hash.ToLowerInvariant() -ne $originalHash) {
              throw 'Copy comparison modified the original'
            }
            Write-Host 'Extracted WAV copy match/mismatch/no-write checks PASS (synthetic)'
            # Exercise zero-private-media operator self-demo from extracted ZIP.
            # The program writes and removes only its disposable generated WAVs.
            $demoReport = & python START-OFFLINE-WAV-PREP.py --demo
            if ($LASTEXITCODE -ne 0 -or -not (($demoReport -join "`n").Contains("SYNTHETIC WAV DEMO PASS: 2"))) {
              throw 'Extracted portable synthetic WAV demo failed'
            }
            if (-not (($demoReport -join "`n").Contains("changed content DIFFERS"))) {
              throw 'Portable demo did not exercise deliberate content difference'
            }
            Write-Host 'Extracted zero-personal-media WAV demo PASS (synthetic)'
            # Real extracted portable must report its full Git source identity
            # and refuse modified files, not merely pass source-tree tests.
            $packageResult = & cmd.exe /d /c '.\OPEN-AUDIOHUB-MUSIC-PREP.cmd --package-check'
            if ($LASTEXITCODE -ne 0 -or -not (($packageResult -join "`n").Contains('LOCAL PORTABLE PACKAGE MATCH'))) {
              throw 'Extracted portable package consistency check failed'
            }
            if (-not (($packageResult -join "`n").Contains($env:SOURCE_COMMIT))) {
              throw 'Portable reports a source SHA differing from build commit'
            }
            Write-Host 'Extracted Windows package contents and exact source commit MATCH'
            # New operator journey: ONE script checks prerequisites, exact
            # extracted package and synthetic WAV demo without any user media.
            $firstRun = & cmd.exe /d /c '.\OPEN-AUDIOHUB-MUSIC-PREP.cmd --smoke'
            if ($LASTEXITCODE -ne 0 -or -not (($firstRun -join "`n").Contains('AudioHub FIRST-RUN SMOKE PASS'))) {
              throw 'One-click operator first-run smoke did not pass'
            }
            if (-not (($firstRun -join "`n").Contains($env:SOURCE_COMMIT))) {
              throw 'One-click smoke did not verify exact package source SHA'
            }
            Write-Host 'One-click Windows first-run dependency/package/demo smoke PASS (synthetic)'
            # Reproduce a real operator environment: py.exe is present but
            # unsuitable; a separate compatible python.exe is on PATH.
            # The decoy is only a copy of Microsoft's own where.exe inside
            # the disposable GitHub runner temp directory; no real Python
            # installation, published ZIP or operator machine is modified.
            $fakePythonFolder = Join-Path $env:RUNNER_TEMP 'audiohub-incompatible-py'
            New-Item -ItemType Directory -Path $fakePythonFolder -Force | Out-Null
            Copy-Item -LiteralPath (Join-Path $env:SystemRoot 'System32\where.exe') -Destination (Join-Path $fakePythonFolder 'py.exe') -Force
            $originalPath = $env:PATH
            try {
              $env:PATH = "$fakePythonFolder;$originalPath"
              $fallbackReport = & cmd.exe /d /c '.\OPEN-AUDIOHUB-MUSIC-PREP.cmd --smoke' 2>&1
              if ($LASTEXITCODE -ne 0 -or -not (($fallbackReport -join "`n").Contains('AudioHub FIRST-RUN SMOKE PASS'))) {
                throw 'Compatible python.exe was not selected after stale py.exe failed'
              }
              if (-not (($fallbackReport -join "`n").Contains('compatible python.exe fallback runtime'))) {
                throw 'Fallback runner not actually selected'
              }
              $fallbackPackage = & cmd.exe /d /c '.\OPEN-AUDIOHUB-MUSIC-PREP.cmd --package-check' 2>&1
              if ($LASTEXITCODE -ne 0 -or -not (($fallbackPackage -join "`n").Contains($env:SOURCE_COMMIT))) {
                throw 'Standalone no-Tk package check did not use fallback Python'
              }
            } finally {
              $env:PATH = $originalPath
            }
            Write-Host 'Native Windows stale py.exe -> compatible python.exe fallback PASS (synthetic)'
            # Only alter a disposable extracted README after all positive tests.
            # Never modify the build ZIP, real operator files, or repo checkout.
            $tamperTestReadme = Join-Path (Get-Location) 'README-OFFLINE-WAV-PREP.md'
            Add-Content -LiteralPath $tamperTestReadme -Value '# synthetic post-extraction tamper'
            $tamperReport = & python START-OFFLINE-WAV-PREP.py --package-check 2>&1
            if ($LASTEXITCODE -ne 2 -or -not (($tamperReport -join "`n").Contains('LOCAL PORTABLE PACKAGE REFUSED'))) {
              throw 'Portable package check failed to detect altered member'
            }
            $global:LASTEXITCODE = 0
            Write-Host 'Extracted Windows package tampering REFUSED (synthetic, no protected changes)'
            # After tampering, the launcher MUST block --smoke before --demo,
            # and must not misrepresent a corrupt package as a successful run.
            $blockedStart = & cmd.exe /d /c '.\OPEN-AUDIOHUB-MUSIC-PREP.cmd --smoke' 2>&1
            if ($LASTEXITCODE -ne 2 -or -not (($blockedStart -join "`n").Contains('START REFUSED'))) {
              throw 'One-click smoke failed to block altered extracted package'
            }
            if (($blockedStart -join "`n").Contains('SYNTHETIC WAV DEMO PASS')) {
              throw 'Tampered portable incorrectly executed the synthetic demo'
            }
            $global:LASTEXITCODE = 0
            Write-Host 'One-click launcher refuses altered extracted package before demo PASS (synthetic)'

          } finally { Pop-Location }
          Write-Host "Windows operator ALPHA source-only smoke PASS. No GUI launched or hardware claim."

name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  documentation-and-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Exact immutable PR head, never the synthetic pull-request merge SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check mandatory project policies
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          test -s SECURITY.md
          test -s docs/STATUS.md
          test -s docs/RELEASE-POLICY.md
          test -s .github/FUNDING.yml
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q "No verified ready-to-flash" docs/STATUS.md
          if grep -RInF 'AudioHub-Setup-2026' src image; then
            echo "Unsafe shared provisioning secret detected" >&2
            exit 1
          fi
      - name: Review-only Model C licensing safety guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/license_transition_audit.py

      - name: Detect unreviewed source runtime dependencies and third-party assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source_dependency_audit.py

      - name: Require per-file source ownership and third-party review ledger
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source_rights_ledger.py

      - name: Check any checked-in Python or JS sources
        shell: bash
        run: |
          set -euo pipefail
          if [ -d src ]; then python3 -m compileall -q src; fi
          if [ -d tests ]; then python3 -m unittest discover -s tests -v; fi
          if [ -f web/app.js ]; then node --check web/app.js; fi
          bash -n build-image.sh image/stage-audiohub/prerun.sh image/stage-audiohub/01-install/00-run.sh
      - name: Package offline Windows bridge alpha (NOT a release)
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 scripts/package_windows_bridge.py --source-sha "$SOURCE_COMMIT" --directory dist/windows
          cd dist/windows
          sha256sum -c SHA256SUMS-WINDOWS.txt
          python3 - <<'PY'
          import glob
          import zipfile
          archives = glob.glob("AudioHub-Windows-TLS-Bridge-ALPHA-*.zip")
          assert len(archives) == 1
          with zipfile.ZipFile(archives[0]) as archive:
              assert archive.testzip() is None
              assert len(archive.namelist()) == 12
          print("Windows portable bridge bundle integrity PASS; NOT released")
          PY
      - name: Upload temporary Windows offline operator alpha
        id: windows_alpha
        uses: actions/upload-artifact@v4
        with:
          name: AUDIOHUB-WINDOWS-TLS-ALPHA-UNVERIFIED
          path: |
            dist/windows/AudioHub-Windows-TLS-Bridge-ALPHA-*.zip
            dist/windows/SHA256SUMS-WINDOWS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Show Windows lab package in job summary
        shell: bash
        env:
          BUNDLE_ARTIFACT_URL: ${{ steps.windows_alpha.outputs.artifact-url }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_ARTIFACT_URL"
          {
            echo "## Windows TLS audio bridge: UNVERIFIED isolated lab ALPHA"
            echo
            echo "**[Download temporary operator ZIP]($BUNDLE_ARTIFACT_URL)**"
            echo
            echo "Archive contains nested platform ZIP and SHA256SUMS-WINDOWS.txt."
            echo "Not a Windows driver or production release. Requires Python 3.11+,"
            echo "Scream driver for program audio (NOT for speaker soundcheck), keys and"
            echo "an explicitly authorized isolated Pi4 lab. No auto installation."
            echo
            echo "Source SHA: $SOURCE_COMMIT"
            echo "Local bundle checksum:"
            echo '~~~'
            cat dist/windows/SHA256SUMS-WINDOWS.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
  windows-operator-smoke:
    # Cross-OS byte-for-byte ZIP proof, real Windows Python/Tk/import/smoke.
    needs: documentation-and-safety
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact-head Linux portable ZIP checksum
        uses: actions/download-artifact@v4
        with:
          name: AUDIOHUB-WINDOWS-TLS-ALPHA-UNVERIFIED
          path: dist/linux-baseline
      - name: Native Windows GUI/portable offline smoke
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = Join-Path $PWD 'src'
          python -m unittest discover -s tests -p "test_windows*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows offline tests failed' }
          python -c "import tkinter; print('Windows Tk runtime available: ', tkinter.TkVersion)"
          if ($LASTEXITCODE -ne 0) { throw 'Windows Tk unavailable' }
          python scripts/package_windows_bridge.py --source-sha $env:SOURCE_COMMIT --directory dist/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed' }
          $package = Get-ChildItem dist/windows -Filter "AudioHub-Windows-TLS-Bridge-ALPHA-*.zip" | Select-Object -First 1
          if (-not $package) { throw 'No Windows alpha ZIP' }
          $expected = ((Get-Content dist/windows/SHA256SUMS-WINDOWS.txt -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Windows package SHA256 mismatch' }
          $linuxExpected = ((Get-Content dist/linux-baseline/SHA256SUMS-WINDOWS.txt -Raw).Trim() -split '\s+')[0]
          if ($linuxExpected -ne $actual) { throw 'Windows vs Linux ZIP bytes differ for exact source SHA' }
          Write-Host ("Cross-OS identical source ZIP SHA256: " + $actual)
          Expand-Archive -LiteralPath $package.FullName -DestinationPath dist/windows/unpacked
          $folder = Join-Path (Resolve-Path dist/windows/unpacked) ("AudioHub-Windows-TLS-Bridge-ALPHA-" + $env:SOURCE_COMMIT.Substring(0, 12))
          Push-Location $folder
          try {
            python START-WINDOWS-BRIDGE.py --self-check
            if ($LASTEXITCODE -ne 0) { throw 'Portable starter failed' }
            python START-WINDOWS-BRIDGE.py --gui --help
            if ($LASTEXITCODE -ne 0) { throw 'Portable GUI CLI failed' }
          } finally { Pop-Location }
          Write-Host "Windows operator ALPHA source-only smoke PASS. No GUI launched or hardware claim."

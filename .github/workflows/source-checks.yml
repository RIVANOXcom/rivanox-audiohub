name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  documentation-and-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check mandatory project policies
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          test -s SECURITY.md
          test -s docs/STATUS.md
          test -s docs/RELEASE-POLICY.md
          test -s .github/FUNDING.yml
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          grep -q "No verified ready-to-flash" docs/STATUS.md
          if grep -RInF 'AudioHub-Setup-2026' src image; then
            echo "Unsafe shared provisioning secret detected" >&2
            exit 1
          fi
      - name: Install pinned Ed25519 test dependency in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/audiohub-owner-test-venv"
          "$RUNNER_TEMP/audiohub-owner-test-venv/bin/python" -m pip install --disable-pip-version-check -r tests/requirements-owner-crypto.txt
          "$RUNNER_TEMP/audiohub-owner-test-venv/bin/python" -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey"
          echo "$RUNNER_TEMP/audiohub-owner-test-venv/bin" >> "$GITHUB_PATH"
      - name: Check any checked-in Python or JS sources
        shell: bash
        run: |
          set -euo pipefail
          if [ -d src ]; then python3 -m compileall -q src; fi
          if [ -d tests ]; then python3 -m unittest discover -s tests -v; fi
          if [ -f web/app.js ]; then node --check web/app.js; fi
          bash -n build-image.sh image/stage-audiohub/prerun.sh image/stage-audiohub/01-install/00-run.sh

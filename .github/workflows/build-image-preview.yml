name: Build unverified Pi 4 image
on:
  workflow_dispatch:
  push:
    branches: [audiohub-preview-build]
permissions:
  contents: read
concurrency:
  group: audiohub-preview-image
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Free limited hosted-runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet || true
          df -h /
      - name: Install Pi image toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip dosfstools e2fsprogs libcap2-bin grep rsync xz-utils file git curl bc gpg pigz xxd arch-test bmap-tools kmod openssl
      - name: Verify native ARM64 builder prerequisites
        run: |
          test "$(uname -m)" = "aarch64"
          command -v qemu-aarch64
          command -v arch-test
          uname -a
          df -h /
      - name: Run source tests before experimental image build
        run: python3 -m unittest discover -s tests -v
      - name: Build preview (NOT a release)
        env:
          AUDIOHUB_BUILD_ACCEPT_PREVIEW: YES
        run: ./build-image.sh
      - name: Stage and verify unverified image outside root-owned builder directory
        run: |
          set -euo pipefail
          mkdir -p dist
          sudo cp .pi-gen-build/pi-gen/deploy/*.img.xz dist/
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          shopt -s nullglob
          images=( *.img.xz )
          test "${#images[@]}" -eq 1
          sha256sum -- "${images[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          xz --test -- "${images[@]}"
          test -s SHA256SUMS.txt
      - name: Upload short-lived unverified artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUDIOHUB-ALPHA-UNVERIFIED-DO-NOT-DISTRIBUTE
          path: |
            dist/*.img.xz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

name: Build unverified Pi 4 image
on:
  workflow_dispatch:
  push:
    branches: [audiohub-preview-build, wd-papa-5b2e6939-image-audit, wd-papa-5b2e6939-preview-download-trace-20261105, wd-papa-5b2e6939-pi-preview-local-status-20261105, wd-papa-5b2e6939-offline-boot-diagnostics-20261105, wd-papa-5b2e6939-audio-path-integration-20261105, wd-papa-5b2e6939-audio-routing-gain-budget-20261105, wd-papa-5b2e6939-three-input-laptop-integration-20261105, wd-papa-5b2e6939-configurable-input-names-and-handoff-20261105, wd-papa-5b2e6939-flexible-source-route-assignment-20261105, wd-papa-5b2e6939-live-pipewire-graph-validation-20261105, wd-papa-5b2e6939-licensing-sustainability-release-checks-20261105, wd-papa-20261105-rootfs-license-inventory, wd-papa-20261105-legal-inventory-export-fix, wd-papa-20261105-rootfs-copyright-links, wd-papa-20261105-copyright-triage-and-doc-alias-policy, wd-papa-20261105-dpkg-identity-reconciliation, wd-papa-20261105-readonly-web-file-hardening, wd-papa-20261105-runtime-state-atomic-security, wd-papa-20261105-supervisor-error-route-cleanup, wd-papa-20261105-bluetooth-trust-authorization-gate, wd-papa-20261106-bounded-pipewire-process-output, wd-papa-20261106-offline-hardware-acceptance-checklist, wd-papa-20261106-failclosed-pipewire-identity-ambiguity, wd-papa-20261106-offline-diag-runtime-path-nofollow, wd-papa-20261106-laptop-pipewire-bounded-process, wd-papa-20261106-bounded-status-http-workers-privacy, wd-papa-20261106-private-status-file-identity, wd-papa-20261106-status-parser-failclosed, wd-papa-20261106-strict-status-json-integrity, wd-papa-20261106-status-http-total-deadline-privacy]
permissions:
  contents: read
concurrency:
  group: audiohub-preview-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Free limited hosted-runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet || true
          df -h /
      - name: Install Pi image toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip dosfstools e2fsprogs libcap2-bin grep rsync xz-utils file git curl bc gpg pigz xxd arch-test bmap-tools kmod openssl
      - name: Verify native ARM64 builder prerequisites
        run: |
          test "$(uname -m)" = "aarch64"
          command -v qemu-aarch64
          command -v arch-test
          uname -a
          df -h /
      - name: Run source tests before experimental image build
        run: python3 -m unittest discover -s tests -v
      - name: Build preview (NOT a release)
        env:
          AUDIOHUB_BUILD_ACCEPT_PREVIEW: YES
        run: ./build-image.sh
      - name: Stage and verify unverified image outside root-owned builder directory
        run: |
          set -euo pipefail
          mkdir -p dist
          sudo cp .pi-gen-build/pi-gen/deploy/*.img.xz dist/
          sudo cp .pi-gen-build/pi-gen/deploy/ROOTFS-PACKAGES.json dist/
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          shopt -s nullglob
          images=( *.img.xz )
          test "${#images[@]}" -eq 1
          sha256sum -- "${images[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          xz --test -- "${images[@]}"
          test -s SHA256SUMS.txt
          cd ..
          python3 scripts/preview_manifest.py \
            --directory dist \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --build-script build-image.sh
          test -s dist/PREVIEW-MANIFEST.json
      - name: Check preview bundle provenance, XZ and NO-GO release classification
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_bundle_audit.py \
            --directory dist \
            --expected-source-sha "$GITHUB_SHA"
          # This preflight always reports public_release_ready=false.
          # It is NOT a release workflow or operator approval.
      - name: Upload temporary unverified Pi 4 image artifact
        id: preview_artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUDIOHUB-ALPHA-UNVERIFIED-DO-NOT-DISTRIBUTE
          path: |
            dist/*.img.xz
            dist/SHA256SUMS.txt
            dist/PREVIEW-MANIFEST.json
            dist/ROOTFS-PACKAGES.json
          if-no-files-found: error
          retention-days: 30
      - name: Show test-image download in GitHub job summary
        shell: bash
        env:
          PREVIEW_ARTIFACT_URL: ${{ steps.preview_artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_ARTIFACT_URL"
          {
            echo "## Raspberry Pi 4: UNVERIFIED AudioHub test image"
            echo
            echo "**[Download the temporary test-image ZIP]($PREVIEW_ARTIFACT_URL)**"
            echo
            echo "Sign in to GitHub and open the run's **Artifacts** section if required."
            echo "The ZIP contains an \`.img.xz\`, \`SHA256SUMS.txt\` and \`PREVIEW-MANIFEST.json\`."
            echo "Artifact retention requested: 30 days (repository policy may reduce it)."
            echo
            echo "**Warning:** SOURCE BUILD ONLY, not hardware-verified, no secure phone setup."
            echo "No official release, do not use on a trusted home network."
            echo "Flash a spare microSD and test only in an isolated environment."
            echo
            echo "Source SHA: \`$GITHUB_SHA\`"
            echo "Run ID: \`$GITHUB_RUN_ID\`"
            echo
            echo "Full instructions: [experimental first Pi boot](https://github.com/RIVANOXcom/rivanox-audiohub/blob/$GITHUB_SHA/docs/FIRST-PI-ALPHA-TEST.md)."
          } >> "$GITHUB_STEP_SUMMARY"
